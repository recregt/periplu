[project]
name = "periplu-example"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["periplu"]

[tool.uv]
package = false

[tool.uv.sources]
periplu = { path = "../..", editable = true }

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]
periplu_project = "periplu-example"
periplu_baseline = "resources.json"
periplu_failures = "failures"
