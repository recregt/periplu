[project]
name = "periplu"
version = "0.1.0"
description = "A pytest plugin for deterministic container tests: waits end on events, never on clocks"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Framework :: Pytest",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=8.4",
    "pytest-xdist>=3.8",
]

[project.urls]
Repository = "https://github.com/recregt/periplu"

[project.entry-points.pytest11]
periplu = "periplu.plugin"

[tool.pytest.ini_options]
addopts = ["-p", "no:periplu", "-p", "no:cacheprovider"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
