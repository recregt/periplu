remotes:
  - git_url: https://github.com/recregt/commitlint
    ref: v2.0.0
    configs:
      - lefthook-remote.yml

pre-commit:
  commands:
    ruff:
      glob: "*.py"
      run: nix build --no-link .#checks.$(nix eval --raw --impure --expr builtins.currentSystem).ruff
    license:
      run: nix build --no-link .#checks.$(nix eval --raw --impure --expr builtins.currentSystem).license

pre-push:
  commands:
    checks:
      run: nix flake check
